name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Biome
        run: npx biome check --no-errors-on-unmatched --files-ignore-unknown=true src tests biome.json vite.config.ts playwright.config.ts openapi-ts.config.ts
      - name: Type-check and build
        run: npm run build

  integration-required:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Playwright and cross-repository healthchecks must be recorded from ops/dev-test.sh --repo admin before merge."
